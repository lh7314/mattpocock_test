<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>UI end-to-end probe</title>
<style>body{font:13px/1.5 Consolas,monospace;margin:14px}pre{white-space:pre-wrap}</style>
</head>
<body data-page="uitest">
<h3>Web MVP end-to-end probe (driven headless by tools/check_web_ui.py)</h3>
<pre id="out">pending</pre>
<iframe id="frame" style="width:1100px;height:760px;border:1px solid #ccc"></iframe>
<script src="assets/rulepack.js"></script>
<script src="assets/core.js"></script>
<script src="assets/store.js"></script>
<script>
/* This page loads the REAL index.html / new.html / result.html in an iframe and drives them
 * the way a user would: type values, press 运行分析, wait for the page to navigate, then read
 * what the user would actually see. Nothing here re-implements a business rule - it only
 * asserts what the pages render. */
(function () {
  var frame = document.getElementById("frame");
  var results = [];
  function ok(id, cond, detail) {
    results.push({ id: id, pass: !!cond, detail: detail === undefined ? "" : String(detail).slice(0, 300) });
  }
  function load(url) {
    return new Promise(function (res) {
      frame.onload = function () {
        setTimeout(function () {
          try {
            frame.contentWindow.__err = frame.contentWindow.__err || "";
            frame.contentWindow.onerror = function (m, s, l) {
              frame.contentWindow.__err = (frame.contentWindow.__err || "") + " | " + m + "@" + l;
            };
          } catch (e) { /* cross-origin guard */ }
          res(frame);
        }, 60);
      };
      frame.src = url;
    });
  }
  function text() { try { return frame.contentDocument.body.textContent || ""; } catch (e) { return ""; } }
  function vis() { try { return frame.contentDocument.body.innerText || ""; } catch (e) { return ""; } }
  function html() { try { return frame.contentDocument.documentElement.innerHTML || ""; } catch (e) { return ""; } }
  function doc() { return frame.contentDocument; }
  function set(sel, v) {
    var e = doc().getElementById(sel);
    if (!e) { return false; }
    e.value = v;
    e.dispatchEvent(new frame.contentWindow.Event("input", { bubbles: true }));
    return true;
  }
  function click(sel) {
    var e = doc().getElementById(sel);
    if (!e) { return false; }
    e.click(); return true;
  }
  function fireQ(e, type) {
    var Ev = frame.contentWindow.Event;      // new frame.contentWindow.Event(...) would
    e.dispatchEvent(new Ev(type, { bubbles: true }));     // call the constructor as a function
  }
  // A dropdown only accepts a value it actually offers. Answering one with a word that is
  // not on the list is exactly what a reviewer cannot do, so the probe may not do it either:
  // this refuses instead of leaving a blank behind that looks like an unanswered question.
  function setQ(qid, k, v) {
    var e = doc().querySelector('[data-q="' + qid + '"][data-k="' + k + '"]');
    if (!e) { return "NO_ELEMENT"; }
    if (e.tagName === "SELECT") { return "NOT_A_TEXT_CONTROL"; }
    e.value = v;
    fireQ(e, "input"); fireQ(e, "change");
    return "ok";
  }
  function pickQ(qid, value) {
    var sel = doc().querySelector('select[data-q="' + qid + '"]');
    if (!sel) { return "NO_SELECT"; }
    var offered = Array.prototype.some.call(sel.options, function (o) {
      return o.value === value && o.value !== ""; });
    if (!offered) { return "OPTION_NOT_OFFERED"; }
    sel.value = value;
    fireQ(sel, "input"); fireQ(sel, "change");
    return "ok";
  }
  function selectValue(qid) {
    var sel = doc().querySelector('select[data-q="' + qid + '"]');
    return sel ? sel.value : "(no dropdown rendered)";
  }
  function gLast(id) {
    var W = frame.contentWindow;
    var lc = ((W.Trial || {}).lastChecks || { gates: [] });
    for (var i = 0; i < lc.gates.length; i++) {
      if (lc.gates[i].id === id) { return lc.gates[i]; }
    }
    return { id: id, pass: null, label: "(gate not run)", detail: "" };
  }
  function gateSummary() {
    var W = frame.contentWindow;
    var lc = ((W.Trial || {}).lastChecks || { gates: [] });
    var bad = (lc.gates || []).filter(function (g) { return !g.pass; })
      .map(function (g) { return g.id + ": " + (g.detail || g.label || "").slice(0, 46); });
    return bad.length ? bad.join(" ; ") : "all gates pass";
  }
  // what a reviewer does: choose one of the four options, then justify it
  function answerCase(c, option) {
    var res = {};
    (c.questions_required || []).forEach(function (q) {
      if ((q.options || []).length) {
        res[q.id] = pickQ(q.id, option || q.options[0]);
      } else {
        res[q.id] = setQ(q.id, "answer", "同意");
      }
      setQ(q.id, "comment", "演练理由：与真实项目、源文件单元格一致");
    });
    return res;
  }
  function allRequiredTextanswers(c) {
    // v4.1: mismatch cells are four-way choices; everything else stays free text.
    var ans = {};
    (c.questions_required || []).forEach(function (q) {
      var opts = q.options || [];
      ans[q.id] = { answer: opts.length ? opts[0] : "同意",
                    comment: "演练理由：与真实项目、源文件单元格一致" };
    });
    Array.prototype.forEach.call(
      doc().querySelectorAll("#fb-questions [data-q]"), function (e) {
        var a = ans[e.getAttribute("data-q")];
        if (!a) { return; }
        if (e.tagName === "SELECT") { pickQ(e.getAttribute("data-q"), a.answer); }
        else { setQ(e.getAttribute("data-q"), e.getAttribute("data-k"),
                    e.getAttribute("data-k") === "answer" ? a.answer : a.comment); }
      });
    return ans;
  }
  function settle(ms) {
    return new Promise(function (res) { setTimeout(res, ms || 250); });
  }

  function waitPage(prefix, tries) {
    return new Promise(function (res) {
      var n = 0;
      (function poll() {
        var u = "";
        try { u = frame.contentWindow.location.href; } catch (e) { u = ""; }
        if (u.indexOf(prefix) >= 0) { return res(true); }
        if (++n > (tries || 60)) { return res(false); }
        setTimeout(poll, 50);
      })();
    });
  }

  var DOC = {
    schema_version: "4.0", project_name: "UITIE", project_type: "CLEAN_SHEET", odm: null,
    phase_scope: ["FVT", "SIT"],
    key_factors: { cpu: { name: "cpu", user_value: 3, user_edited: true },
                   gpu: { name: "gpu", user_value: 3, user_edited: true },
                   panel: { name: "panel", user_value: 2, user_edited: true },
                   ssd: { name: "ssd", user_value: 2, user_edited: true },
                   mem: { name: "mem", user_value: 2, user_edited: true } },
    wave_assignment: { declared_by: "NOT_PROVIDED", specs: [] },
    certification_input: { mode: "SYSTEM_APPENDIX_ADOPTED", overrides: [] },
    reuse_items: [], additional_demand: [], risk_reserve: { percent: 0 }
  };
  var DOC2 = JSON.parse(JSON.stringify(DOC)); DOC2.project_name = "UISINGLE";
  DOC2.key_factors.cpu.user_value = 1; DOC2.key_factors.gpu.user_value = 1;
  DOC2.key_factors.panel.user_value = 1; DOC2.key_factors.ssd.user_value = 1;
  DOC2.key_factors.mem.user_value = 1;
  var DOC3 = JSON.parse(JSON.stringify(DOC)); DOC3.project_name = "UIOOD";
  DOC3.key_factors.cpu.user_value = 9;
  var DOC4 = JSON.parse(JSON.stringify(DOC)); DOC4.project_name = "UIWAVE";
  DOC4.key_factors = { cpu: { name: "cpu", user_value: 2, user_edited: true },
                       gpu: { name: "gpu", user_value: 2, user_edited: true },
                       panel: { name: "panel", user_value: 1, user_edited: true },
                       ssd: { name: "ssd", user_value: 2, user_edited: true },
                       mem: { name: "mem", user_value: 2, user_edited: true } };
  DOC4.wave_assignment = { declared_by: "USER_SELECTED", specs: [
    { factor: "ssd", spec_index: 2, wave: "LATER_WAVE", wave_source: "USER_SELECTED" },
    { factor: "mem", spec_index: 2, wave: "LATER_WAVE", wave_source: "USER_SELECTED" }] };

  function mkrec(d) {
    var id = Store.newId() + d.project_name;
    var inp = NRE.fromDocument(d); inp.normalise();
    var res = NRE.analyse(inp);
    var payload = NRE.serialise(res, id, 2);
    payload.generated_at_utc = new Date().toISOString();
    payload.certification_grid = RULEPACK.certification_verification.grid;
    var m = res.scenarios[0].match;
    return Store.save({ id: id, document: d, payload: payload,
      certification_grid: RULEPACK.certification_verification.grid,
      project_name: d.project_name, saved_at: new Date().toISOString(), draft: false,
      summary: { sku: m.state === "RANGE" ? (m.sku_range[0] + "–" + m.sku_range[1] + " SKU")
                                          : (m.recommended_sku + " SKU"),
                 demand: "", review: res.owner_review_items.length } });
  }

  var recRange, recSingle, recOOD, recWave;

  // deterministic run: start from an empty local store every time
  try { Store.all().forEach(function (r) { Store.remove(r.id); }); } catch (e) { /* ignore */ }

  Promise.resolve()
  .then(function () {
    ok("UI-18 localStorage available", Store.available());
    recRange = mkrec(DOC); recSingle = mkrec(DOC2); recOOD = mkrec(DOC3); recWave = mkrec(DOC4);
    ok("UI-18 history saved", Store.get(recRange.id) && Store.get(recSingle.id));
    ok("UI-18 recent lists saved records", Store.recent(10).length >= 4,
       Store.recent(10).map(function (r) { return r.project_name; }).join(","));
    var dup = Store.duplicate(recRange.id);
    ok("UI-20 history copy creates a new independent record",
       dup && dup.id !== recRange.id && /副本/.test(dup.project_name)
       && Store.get(dup.id) && dup.document.key_factors.cpu.user_value === 3, dup && dup.project_name);
    Store.remove(dup.id);
    ok("UI-18 history delete", !Store.get(dup.id));
  })
  .then(function () { return load("index.html"); })
  .then(function () {
    var t = text();
    ok("UI-19 home lists recent analyses with project names",
       /UITIE/.test(t) && /UISINGLE/.test(t) && /UIWAVE/.test(t));
    ok("UI-19 home shows SKU result and demand", /SKU/.test(t));
    return load("result.html?id=" + recRange.id);
  })
  .then(function () {
    var t = text();
    ok("UI-02 range page says 4–5 SKU", /4–5 SKU/.test(t), t.slice(0, 0));
    ok("UI-02 page states the range is not a gap and no candidate was chosen",
       /这是一个范围，不是漏填/.test(t) && /没有、也不会默认替你选一档/.test(t));
    ok("UI-10 range reason is SKU_NOT_ESTABLISHED, not competing certification models",
       /SKU_NOT_ESTABLISHED/.test(t) && !/COMPETING_CERTIFICATION_MODELS/.test(t));
    ok("UI-04 result page shows both 4 SKU and 5 SKU priced",
       /4 SKU/.test(t) && /5 SKU/.test(t));
    ok("UI-08 certification states the adopted source and the once-only count",
       /采用附表中本次 SKU 档位/.test(t) && /FVT 采用/.test(t));
    ok("UI-09 the adopted value is counted once and the Main Table derivation zero times",
       /采用值计入项目总量 1 次/.test(t) && /主表派生值（主表单 SKU 数量 × SKU 数）计入 0 次/.test(t)
       && !/附表.*加进总量/.test(t));
    // UI-25: the adopted (Appendix) values are on the default surface, not hidden
    var headDefault = Array.prototype.slice.call(doc().querySelectorAll("th"))
      .filter(function (th) { return !th.closest("details"); })
      .map(function (th) { return th.textContent.trim(); });
    var headDetails = Array.prototype.slice.call(doc().querySelectorAll("details th"))
      .map(function (th) { return th.textContent.trim(); });
    ok("UI-25 adopted Appendix values are visible without expanding anything",
       headDefault.indexOf("采用值（附表）") >= 0 && headDefault.indexOf("状态") >= 0,
       headDefault.join("|"));
    ok("UI-26 Main Table value and delta are only in the expandable details",
       headDetails.indexOf("主表 /SKU") >= 0 && headDetails.indexOf("主表 × SKU（审计）") >= 0
       && headDefault.indexOf("主表 /SKU") < 0 && headDefault.indexOf("差值") < 0,
       headDetails.join("|"));
    ok("UI-12 J33 shown as non-additive evidence",
       /BREAKDOWN_EVIDENCE/.test(t) && /未叠加到结果上/.test(t));
    ok("UI-21 open review items are collected and counted",
       /项需要 Owner 确认/.test(t)
       && parseInt((doc().getElementById("r-open-count") || {}).textContent || "0", 10) > 0
       && /CERTIFICATION|SKU 档位|波次/.test(t),
       "open=" + ((doc().getElementById("r-open-count") || {}).textContent || "?"));
    ok("UI-22 review items do not block the result page",
       /Function 明细/.test(t) && /FVT/.test(t) && /SIT/.test(t));
    ok("UI-16 no hidden single value: a range keeps both endpoints",
       (t.match(/4–5 SKU/g) || []).length >= 1);
    (function () {
      var rec = Store.get(recRange.id);
      var csv = Export.csv(rec);
      var fb = Export.feedbackCsv(rec);
      var jd = Export.jsonDocument(rec);
      var sec4 = csv.indexOf("4. Certification cells - adopted (Appendix) vs audit (Main table)");
      ok("UI-29 review CSV publishes adopted and audit columns with the counted-times flags",
         sec4 >= 0 && /Adopted \(Appendix\),Main \/SKU,Main derived \(audit\)/.test(csv)
         && /,1,0(\u000d\u000a|$)/.test(csv), sec4 >= 0 ? "section 4 present" : "section 4 missing");
      var cells = jd.certification_adopted_and_audit_values || [];
      ok("UI-30 JSON export keeps the adopted value, the audit value and the difference",
         cells.length > 0
         && cells.every(function (c) { return c.main_derived_counted_in_project_total === false; })
         && cells.every(function (c) {
              return c.adopted_value_source !== "APPENDIX_TABLE_TOTAL"
                     || c.adopted_total === c.appendix_total; }),
         "cells=" + cells.length);
      ok("UI-28 trial feedback export lists the mismatched cells and the open ORIs",
         /团队试用反馈表/.test(fb)
         && fb.indexOf("Green") >= 0 && fb.indexOf("RF Certification") >= 0
         && (fb.match(/\u000d\u000aORI-/g) || []).length === RULEPACK.owner_review_item_count,
         "ori rows=" + (fb.match(/\u000d\u000aORI-/g) || []).length);
    })();
    var json = (function () {
      // export content is exercised without triggering a download
      var rec = Store.get(recRange.id);
      var m = rec.payload.scenarios[0].match;
      return m.state === "RANGE" && m.recommended_sku === null
             && m.preferred_sku === "NOT_ESTABLISHED";
    })();
    ok("UI-21 export payload keeps RANGE with null recommended sku", json);
    return load("result.html?id=" + recSingle.id);
  })
  .then(function () {
    var t = text();
    ok("UI-01 single SKU page", /2 SKU/.test(t) && /单一值/.test(t));
    ok("UI-13 MEPA and HW PA shown as temporary", /临时采用/.test(t));
    ok("UI-06 with no LATER_WAVE the page says Current Wave equals Full Project",
       /当前没有明确安排到后续波次的 Spec，因此 Current Wave 与 Full Project 使用相同配置范围/.test(t));
    ok("UI-06 both scopes are still shown side by side",
       /Current Wave 当前波次/.test(t) && /Full Project 全项目/.test(t));
    return load("result.html?id=" + recWave.id);
  })
  .then(function () {
    var t = text();
    ok("UI-07 current wave differs from full project and the reason is explained",
       /已从 Current Wave 排除的 Spec/.test(t) && /ssd2/.test(t) && /mem2/.test(t));
    ok("UI-15 wave does not change base_demand at the same SKU band",
       /base_demand 不因波次改变/.test(t));
    return load("result.html?id=" + recOOD.id);
  })
  .then(function () {
    var t = text();
    ok("UI-24 out-of-domain stops the affected scenario with an explanation",
       /本情景已停止计算/.test(t) && !/FVT\s*SIT\s*Certification/.test(t.split("超出规则库覆盖")[1] || ""));
    ok("UI-24 other scenario is still produced",
       /Full Project/.test(t));
    return load("new.html");
  })
  .then(function () {
    var t = text();
    (function () {
      var pickers = Array.prototype.slice.call(doc().querySelectorAll("select, input"))
        .filter(function (e) {
          var k = ((e.name || "") + " " + (e.id || "")).toLowerCase();
          return k.indexOf("cert") >= 0 || k.indexOf("source") >= 0; });
      var t2 = text();
      ok("UI-27 the user is never asked to choose between Main Table and Appendix",
         pickers.length === 0 && /采用附表中本次 SKU 档位对应的总量/.test(t2)
         && /只用于审计和差异分析，不进入总量/.test(t2),
         "pickers=" + pickers.length);
      ok("UI-11a per-cell override stays analysis-only and is optional",
         doc().querySelectorAll("[data-ovr]").length > 0
         && /本次覆盖（可选）/.test(t2) && /不会写回规则库/.test(t2),
         "override inputs=" + doc().querySelectorAll("[data-ovr]").length);
    })();
    ok("UI-12b new page does not ask for a SKU count", !/SKU\s*数量\s*[:：]/.test(t)
        && /SKU 数量由这些配置推导/.test(t));
    ok("UI-12c wave options are the three Chinese labels, not UNKNOWN",
       /未特别指定/.test(doc().documentElement.innerHTML) && !/UNKNOWN<\/option>/.test(doc().documentElement.innerHTML));
    set("cpu", "3"); set("gpu", "3"); set("panel", "2"); set("ssd-count", "2"); set("mem-count", "2");
    return new Promise(function (r) { setTimeout(r, 120); });
  })
  .then(function () {
    ok("UI-02 live preview reports the 4-5 SKU range before running",
       /4–5 SKU|4-5 SKU/.test(text()), text().slice(0, 0));
    var beforeRun = Store.all().length;
    window.__beforeRun = beforeRun;
    click("run");
    return waitPage("result.html");
  })
  .then(function (nav) {
    var err = "";
    try { err = frame.contentWindow.__err || ""; } catch (e) { err = "?" + e.name; }
    ok("UI-18 pressing 运行分析 saves the analysis and opens the result",
       nav && Store.all().length === window.__beforeRun + 1,
       "nav=" + nav + " storeBefore=" + window.__beforeRun + " storeAfter=" + Store.all().length
       + " href=" + (function () { try { return frame.contentWindow.location.href.split("/").pop(); }
                                catch (e) { return "?" + e.name; } })() + " err=" + err);
    ok("UI-02 run-through reproduces the range", /4–5 SKU/.test(text()));
    var t = text();
    // DEC-10 moved the 4-SKU total from 443.8 to 438.8; the invariant is the same:
    // a decimal total must never be shown as a rounded-up integer.
    ok("UI-16 display precision never invents an integer",
       !/\b439\b/.test(t) && /438\.8/.test(t), (t.match(/\b43\d(\.\d)?\b/g) || []).join(","));
    return load("result.html?id=" + recRange.id);
  })
  .then(function () {
    var rec = Store.get(recRange.id);
    var j = (function () {
      // exercise the export builder directly
      var out = JSON.parse(JSON.stringify(rec.payload));
      return out;
    })();
    ok("UI-17 JSON export carries full precision, not the display value",
       JSON.stringify(j).indexOf("438.8") >= 0);
    ok("UI-17 export declares display precision does not modify values",
       j.policy.display_precision_modifies_values === false);
    ok("UI-17 export refuses to collapse a range",
       j.export.range_collapsed_to_single_value_on_export === false);
    // UI-23: a BLOCKS_FORMALIZATION issue must not stop the manual MVP
    var hasFormalBlock = (j.owner_review_items || []).some(function (o) {
      return o.blocking_level === "BLOCKS_FORMALIZATION"; });
    ok("UI-23 BLOCKS_FORMALIZATION items exist and the run still produced totals",
       hasFormalBlock && j.scenarios.length >= 2 && j.scenarios[0].results.length >= 1);
    ok("UI-22 no item claims it blocks the manual MVP",
       !(j.owner_review_items || []).some(function (o) { return o.blocks_manual_mvp; }));
  })
  /* ---------------- trial mode: web/trial.html ---------------- */
  .then(function () { return load("trial.html"); })
  .then(function () {
    var W = frame.contentWindow, T = W.Trial, K = W.TRIALKIT, t = vis();
    ok("UI-40 trial mode offers exactly the five issued controlled cases",
       !!T && T.cases().length === 5 && /TRIAL-C1-SKU2/.test(t) && /TRIAL-C4-RANGE45/.test(t)
       && /TRIAL-C5-SKU6-WAVE/.test(t), T ? T.cases().length : "no Trial object");
    ok("UI-40 each case states on screen what it exists to prove",
       /Green \/ SIT @ SKU3/.test(t) && /Safety \/ FVT @ SKU6/.test(t)
       && /唯一能看到/.test(t));
    ok("UI-41 the page takes its cases from the generated roster, not its own copy",
       !!K && K.rule_pack === RULEPACK.pack_version && K.cases.length === 5
       && K.cells_covered_by_roster.length === 7 && K.all_mismatch_cells.length === 7,
       K ? (K.rule_pack + " " + (K.cells_covered_by_roster || []).length) : "no TRIALKIT");
    var union = {};
    (K.cases || []).forEach(function (c) {
      (c.covers_cells || []).forEach(function (x) { union[x] = 1; }); });
    ok("UI-41 C1-C5 together still cover 7/7 disagreeing cells",
       Object.keys(union).length === 7, Object.keys(union).join(","));
    var W = frame.contentWindow;
    try { W.localStorage.removeItem(T.sessionKey); } catch (e) { /* ignore */ }
    return load("index.html");
  })
  .then(function () {
    ok("UI-42 the home page has a 参加团队试用 entry", /参加团队试用/.test(vis()));
    return load("trial.html?case=C5");
  })
  .then(function () {
    var t = vis(), d = doc();
    ok("UI-43 picking a case auto-fills the project name", /TRIAL-C5-SKU6-WAVE/.test(t));
    ok("UI-43 the case config is locked, not editable",
       /案例配置不可修改/.test(t) && !d.getElementById("cpu"),
       "no free input for key factors on the trial page");
    ok("UI-43 C5's LATER_WAVE preset is shown, not left to the reviewer",
       /后续波次/.test(t) && /cpu #5/.test(t) && /panel #3/.test(t));
    var W = frame.contentWindow;
    W.__dl = null;                                    // capture the export instead of downloading
    W.Export.download = function (name, txt) { W.__dl = { name: name, text: txt }; };
    W.document.getElementById("run-btn").click();
    return settle(400);
  })
  .then(function () {
    var d = doc(), t = vis();
    ok("UI-44 running the case produced a result on the same page",
       !d.getElementById("result-box").hidden && /Full Project/.test(t) && /Certification/.test(t));
    ok("UI-44 C5 result really reaches 6 SKU and the Safety / FVT cell",
       /6 SKU/.test(t) && /Safety \/ FVT @ SKU6/.test(t));
    var fb = d.getElementById("feedback").innerText || "";
    ok("UI-44 the feedback panel asks only about what this case produced",
       /Safety \/ FVT @ SKU6/.test(fb) && /RF Certification \/ SIT @ SKU6/.test(fb)
       && !/Green \/ SIT @ SKU3/.test(fb) && !/RF Certification \/ SIT @ SKU2/.test(fb)
       && d.querySelectorAll("#fb-questions [data-k=\"answer\"]").length === 11
